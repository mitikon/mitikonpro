name: Calibration diagnostics (manual, read-only)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Historical start date"
        required: true
        default: "2015-01-01"
      targets:
        description: "Comma-separated targets"
        required: true
        default: "SPY,QQQ"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install '.[data,test]'
      - name: Run calibration diagnostics
        run: |
          leading-lambda-calibration-diagnostics \
            --start "${{ inputs.start_date }}" \
            --targets "${{ inputs.targets }}" \
            --output artifacts/calibration
      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calibration-diagnostics-${{ github.run_id }}
          path: artifacts/calibration
          if-no-files-found: error
          retention-days: 90
