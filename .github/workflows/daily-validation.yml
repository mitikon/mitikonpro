name: Daily leading lambda validation

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Historical start date"
        required: true
        default: "2015-01-01"
  pull_request:
    branches: [main]
    paths:
      - "src/leading_signal_lambda/**"
      - "src/maintenance_rsi/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  schedule:
    - cron: "15 2 * * 2-6"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install '.[data,test]'
      - name: Check XNYS trading calendar
        id: market_calendar
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Not a scheduled run; calendar gate bypassed."
            exit 0
          fi
          # calendar-check appends its own should_run to $GITHUB_OUTPUT when
          # that variable is set; blank it so only the decision below is emitted.
          GITHUB_OUTPUT= leading-lambda-independent calendar-check > calendar_decision.json
          cat calendar_decision.json
          completed=$(python -c "import json;print(json.load(open('calendar_decision.json'))['completed_session'])")
          expected=$(date -u -d 'yesterday' +%F)
          if [ "$completed" = "$expected" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::XNYS had no session on ${expected} (latest completed session: ${completed}). Validation skipped without changing state."
          fi
      - name: Install malware scanner for external data guard
        if: steps.market_calendar.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam --quiet || sudo freshclam --quiet
      - name: Unit tests
        if: steps.market_calendar.outputs.should_run == 'true'
        run: python -m pytest -q
      - name: Run completed-daily-data validation
        if: steps.market_calendar.outputs.should_run == 'true'
        env:
          START_DATE: ${{ inputs.start_date || '2015-01-01' }}
        run: leading-lambda-validate --start "$START_DATE" --output artifacts/validation
      - name: Download previous frozen signal and cumulative histories
        if: steps.market_calendar.outputs.should_run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/previous/latest artifacts/history-sources
          mapfile -t previous_runs < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-validation.yml/runs?status=success&per_page=30" \
              --jq ".workflow_runs | map(select(.id != ${GITHUB_RUN_ID})) | .[].id"
          )
          if [ "${#previous_runs[@]}" -gt 0 ]; then
            gh run download "${previous_runs[0]}" --repo "$GITHUB_REPOSITORY" \
              --pattern "leading-lambda-validation-*" --dir artifacts/previous/latest || true
          fi
          for run_id in "${previous_runs[@]}"; do
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --pattern "leading-lambda-validation-*" --dir "artifacts/history-sources/$run_id" || true
          done
      - name: Freeze next-session signals
        if: steps.market_calendar.outputs.should_run == 'true'
        env:
          START_DATE: ${{ inputs.start_date || '2015-01-01' }}
        run: |
          previous=$(find artifacts/previous/latest -name forward_signal.json -print -quit 2>/dev/null || true)
          previous_rsi_state=$(find artifacts/previous/latest -name recursive_rsi_state.json -print -quit 2>/dev/null || true)
          # One file per parallel candidate slot: the base name for slot 1
          # and "_2"/"_3"-suffixed names for the others (see forward.py's
          # _slot_path). Sorting is lexicographic, and "." sorts before "_"
          # so the base file always lists first, in slot order.
          mapfile -t previous_candidates < <(find artifacts/previous/latest -name 'recursive_rsi_candidate_signal*.json' -print 2>/dev/null | sort)
          mapfile -t previous_histories < <(find artifacts/history-sources -name signal_result_history.csv -print 2>/dev/null | sort)
          mapfile -t previous_trade_histories < <(find artifacts/history-sources -name selected_trade_history.csv -print 2>/dev/null | sort)
          if [ -n "$previous" ]; then
            args=(--input-dir artifacts/validation/raw --output artifacts/validation/forward_signal.json --previous "$previous")
            if [ -n "$previous_rsi_state" ]; then
              args+=(--previous-rsi-state "$previous_rsi_state")
            fi
            for candidate in "${previous_candidates[@]}"; do
              args+=(--previous-candidate-signal "$candidate")
            done
            for history in "${previous_histories[@]}"; do
              args+=(--previous-history "$history")
            done
            for history in "${previous_trade_histories[@]}"; do
              args+=(--previous-trade-history "$history")
            done
            leading-lambda-forward "${args[@]}"
          else
            leading-lambda-forward --input-dir artifacts/validation/raw --output artifacts/validation/forward_signal.json
          fi
      - name: Upload immutable validation result
        if: always() && steps.market_calendar.outputs.should_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leading-lambda-validation-${{ github.run_number }}
          path: artifacts/validation
          if-no-files-found: error
          retention-days: 90
