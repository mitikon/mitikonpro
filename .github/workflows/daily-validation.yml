name: Daily leading lambda validation

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Historical start date"
        required: true
        default: "2015-01-01"
  pull_request:
    branches: [main]
    paths:
      - "src/leading_signal_lambda/**"
      - "src/maintenance_rsi/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  schedule:
    - cron: "15 2 * * 2-6"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install '.[data,test]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Run completed-daily-data validation
        env:
          START_DATE: ${{ inputs.start_date || '2015-01-01' }}
        run: leading-lambda-validate --start "$START_DATE" --output artifacts/validation
      - name: Download previous frozen signal and cumulative histories
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/previous/latest artifacts/history-sources
          mapfile -t previous_runs < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-validation.yml/runs?status=success&per_page=30" \
              --jq ".workflow_runs | map(select(.id != ${GITHUB_RUN_ID})) | .[].id"
          )
          if [ "${#previous_runs[@]}" -gt 0 ]; then
            gh run download "${previous_runs[0]}" --repo "$GITHUB_REPOSITORY" \
              --pattern "leading-lambda-validation-*" --dir artifacts/previous/latest || true
          fi
          for run_id in "${previous_runs[@]}"; do
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --pattern "leading-lambda-validation-*" --dir "artifacts/history-sources/$run_id" || true
          done
      - name: Freeze next-session signals
        env:
          START_DATE: ${{ inputs.start_date || '2015-01-01' }}
        run: |
          previous=$(find artifacts/previous/latest -name forward_signal.json -print -quit 2>/dev/null || true)
          mapfile -t previous_histories < <(find artifacts/history-sources -name signal_result_history.csv -print 2>/dev/null | sort)
          mapfile -t previous_trade_histories < <(find artifacts/history-sources -name selected_trade_history.csv -print 2>/dev/null | sort)
          if [ -n "$previous" ]; then
            args=(--input-dir artifacts/validation/raw --output artifacts/validation/forward_signal.json --previous "$previous")
            for history in "${previous_histories[@]}"; do
              args+=(--previous-history "$history")
            done
            for history in "${previous_trade_histories[@]}"; do
              args+=(--previous-trade-history "$history")
            done
            leading-lambda-forward "${args[@]}"
          else
            leading-lambda-forward --input-dir artifacts/validation/raw --output artifacts/validation/forward_signal.json
          fi
      - name: Upload immutable validation result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leading-lambda-validation-${{ github.run_number }}
          path: artifacts/validation
          if-no-files-found: error
          retention-days: 90
