name: Daily leading lambda validation

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Historical start date"
        required: true
        default: "2015-01-01"
  pull_request:
    branches: [main]
    paths:
      - "src/leading_signal_lambda/**"
      - "src/racing_lambda/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/daily-validation.yml"
  schedule:
    - cron: "15 2 * * 2-6"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install '.[data,test]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Run completed-daily-data validation
        env:
          START_DATE: ${{ inputs.start_date || '2015-01-01' }}
        run: leading-lambda-validate --start "$START_DATE" --output artifacts/validation
      - name: Download previous frozen signal
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-validation.yml/runs?status=success&per_page=10" --jq ".workflow_runs | map(select(.id != ${GITHUB_RUN_ID})) | first | .id")
          if [ -n "$previous_run" ] && [ "$previous_run" != "null" ]; then
            gh run download "$previous_run" --repo "$GITHUB_REPOSITORY" --pattern "leading-lambda-validation-*" --dir artifacts/previous
          fi
      - name: Freeze next-session signals
        env:
          START_DATE: ${{ inputs.start_date || '2015-01-01' }}
        run: |
          previous=$(find artifacts/previous -name forward_signal.json -print -quit 2>/dev/null || true)
          previous_history=$(find artifacts/previous -name signal_result_history.csv -print -quit 2>/dev/null || true)
          previous_trade_history=$(find artifacts/previous -name selected_trade_history.csv -print -quit 2>/dev/null || true)
          if [ -n "$previous" ]; then
            args=(--input-dir artifacts/validation/raw --output artifacts/validation/forward_signal.json --previous "$previous")
            if [ -n "$previous_history" ]; then
              args+=(--previous-history "$previous_history")
            fi
            if [ -n "$previous_trade_history" ]; then
              args+=(--previous-trade-history "$previous_trade_history")
            fi
            leading-lambda-forward "${args[@]}"
          else
            leading-lambda-forward --input-dir artifacts/validation/raw --output artifacts/validation/forward_signal.json
          fi
      - name: Upload immutable validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leading-lambda-validation-${{ github.run_number }}
          path: artifacts/validation
          if-no-files-found: error
          retention-days: 90
