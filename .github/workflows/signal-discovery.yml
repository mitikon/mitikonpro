name: Signal discovery scan (manual, read-only)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Historical start date"
        required: true
        default: "2015-01-01"
      min_annualized_return:
        description: "Minimum annualized return bar for a survivor"
        required: true
        default: "0.15"
      alpha:
        description: "FDR alpha"
        required: true
        default: "0.05"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install '.[data,test]'
      - name: Run pairwise signal discovery scan
        run: |
          leading-lambda-signal-discovery \
            --start "${{ inputs.start_date }}" \
            --min-annualized-return "${{ inputs.min_annualized_return }}" \
            --alpha "${{ inputs.alpha }}" \
            --output artifacts/signal-discovery
      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signal-discovery-${{ github.run_id }}
          path: artifacts/signal-discovery
          if-no-files-found: error
          retention-days: 90
