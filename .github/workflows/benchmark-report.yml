name: Benchmark report (manual, read-only)

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated targets"
        required: true
        default: "SPY"
      start:
        description: "Window start (inclusive, YYYY-MM-DD)"
        required: true
      end_inclusive:
        description: "Window end (inclusive, YYYY-MM-DD)"
        required: true

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install '.[data,test]'
      - name: Run benchmark report
        run: |
          leading-lambda-benchmark \
            --targets "${{ inputs.targets }}" \
            --start "${{ inputs.start }}" \
            --end-inclusive "${{ inputs.end_inclusive }}" \
            --output artifacts/benchmark
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-report-${{ github.run_id }}
          path: artifacts/benchmark
          if-no-files-found: error
          retention-days: 90
